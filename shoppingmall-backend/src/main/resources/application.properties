spring.application.name=shopping

spring.datasource.url=jdbc:mysql://localhost:3306/shopping_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=REMOVED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=REMOVED_JWT_SECRET
jwt.expiration-milliseconds=360000