spring.application.name=shopping
# Import local configuration when launched from the repository root or backend directory.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

#redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#jwt
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-milliseconds=${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}
jwt.refresh-token-expiration-milliseconds=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
jwt.refresh-cookie-path=${JWT_REFRESH_COOKIE_PATH:/api/members}
jwt.refresh-cookie-max-age-seconds=${JWT_REFRESH_COOKIE_MAX_AGE_eSECONDS:604800}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
