spring.application.name=shopping

spring.datasource.url=jdbc:mysql://localhost:3306/shopping_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=REMOVED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DataBase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=REMOVED_JWT_SECRET
jwt.access-token-expiration-milliseconds=1800000
jwt.refresh-token-expiration-milliseconds=604800000

# Refresh Token Cookie
jwt.refresh-cookie-name=refreshToken
jwt.refresh-cookie-path=/api/members
jwt.refresh-cookie-max-age-seconds=604800
jwt.refresh-cookie-secure=false
jwt.refresh-cookie-same-site=Lax

# Frontend
app.frontend-origin=http://localhost:5173