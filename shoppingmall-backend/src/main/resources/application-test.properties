# Isolated test database; never connect tests to the local MySQL database.
spring.datasource.url=jdbc:h2:mem:shopping-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Deliberately public fixture, used only by the test profile.
jwt.secret=test-only-shopping-jwt-secret-not-for-production-at-least-48-bytes
jwt.access-token-expiration-milliseconds=1800000
jwt.refresh-token-expiration-milliseconds=604800000
jwt.refresh-cookie-name=refreshToken
jwt.refresh-cookie-path=/api/members
jwt.refresh-cookie-max-age-seconds=604800
jwt.refresh-cookie-secure=false
jwt.refresh-cookie-same-site=Lax
app.frontend-origin=http://localhost:5173
